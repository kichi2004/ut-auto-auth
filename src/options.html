<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./options.css" />
</head>
<body>
<h1 data-i18n="settingsHeading"></h1>
<div class="form-group">
  <label for="user-id" data-i18n="utid13Label"></label>
  <input id="user-id" name="userid" placeholder="0012026099999" />
</div>
<div class="form-group">
  <label for="user-name" data-i18n="utidNameLabel"></label>
  <input id="user-name" name="username" placeholder="s2609999" />
  <button type="button" id="auto-id" data-i18n="autoFillButton"></button>
</div>
<div class="form-group">
  <label for="password" data-i18n="passwordLabel"></label>
  <input id="password" name="password" type="password" />
</div>
<button type="button" id="save" data-i18n="saveButton"></button>
<div class="notice">
  <p data-i18n-html="noticeText"></p>
</div>
<script src="./options.js"></script>
</body>
</html>
